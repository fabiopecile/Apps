<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Staatliches&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E23D2E; } a:hover { color: #F0A830; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #16120F; font-family: 'Barlow Semi Condensed', sans-serif; color: #F4EDE0; display: flex; flex-direction: column; overflow: hidden;">

  <!-- feed -->
  <div style="position: relative; height: 430px; background: linear-gradient(175deg, #2A211B 0%, #17120F 100%); overflow: hidden;">
    <div style="position: absolute; inset: 0; background-image: radial-gradient(65% 42% at 50% 60%, rgba(240,168,48,0.28) 0%, rgba(22,18,15,0) 72%);"></div>

    <div style="position: relative; display: flex; align-items: center; gap: 10px; padding: 18px;">
      <div style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px; border-radius: 2px; background: #E23D2E;">
        <div style="width: 7px; height: 7px; border-radius: 4px; background: #FFF6EA;"></div>
        <span style="font-family: Staatliches, sans-serif; font-size: 13px; letter-spacing: 1.8px; color: #FFF6EA;">LIVE</span>
      </div>
      <div style="flex-grow: 1;"></div>
      <span style="font-family: Staatliches, sans-serif; font-size: 15px; letter-spacing: 1.4px; color: #A89887;">RUNDE 3</span>
    </div>

    <svg style="position: relative; display: block; margin: 16px auto 0 auto;" width="250" height="220" viewBox="0 0 250 220" fill="none">
      <ellipse cx="125" cy="196" rx="104" ry="17" fill="#F0A830" opacity="0.10"/>
      <g stroke="#F0A830" stroke-width="2" opacity="0.4">
        <ellipse cx="72" cy="60" rx="20" ry="7"/><ellipse cx="125" cy="60" rx="20" ry="7"/><ellipse cx="178" cy="60" rx="20" ry="7"/>
      </g>
      <g stroke="#F0A830" stroke-width="2" opacity="0.6">
        <ellipse cx="98" cy="104" rx="21" ry="7.4"/><ellipse cx="152" cy="104" rx="21" ry="7.4"/>
      </g>
      <g>
        <ellipse cx="125" cy="150" rx="23" ry="8" fill="rgba(226,61,46,0.3)" stroke="#E23D2E" stroke-width="3.4"/>
        <circle cx="125" cy="150" r="40" fill="none" stroke="#E23D2E" stroke-width="1.8" opacity="0.45"/>
      </g>
    </svg>
  </div>

  <!-- the ask, as a poster panel -->
  <div style="flex-grow: 1; background: #16120F; padding: 20px; display: flex; flex-direction: column; gap: 15px;">

    <div>
      <div style="font-family: Staatliches, sans-serif; font-size: 32px; line-height: 32px; letter-spacing: 0.8px;">BECHER WEG?</div>
      <div style="font-size: 13px; color: #A89887; margin-top: 4px;">Vordere Reihe, Mitte</div>
    </div>

    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; height: 64px; border-radius: 3px; background: #E23D2E; display: flex; align-items: center; justify-content: center; gap: 10px;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#FFF6EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-family: Staatliches, sans-serif; font-size: 22px; letter-spacing: 1.6px; color: #FFF6EA;">TREFFER</span>
      </div>
      <div style="width: 116px; height: 64px; border-radius: 3px; border: 1.5px solid rgba(244,237,224,0.22); display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="#A89887" stroke-width="2.6" stroke-linecap="round"/></svg>
        <span style="font-family: Staatliches, sans-serif; font-size: 19px; letter-spacing: 1.2px; color: #A89887;">NEIN</span>
      </div>
    </div>

    <!-- scoreboard as two ticket stubs -->
    <div style="display: flex; gap: 10px;">
      <div style="flex-grow: 1; padding: 13px 15px; border-radius: 3px; background: rgba(226,61,46,0.13); border-left: 3px solid #E23D2E;">
        <div style="font-family: Staatliches, sans-serif; font-size: 14px; letter-spacing: 1.6px; color: #E23D2E;">DIE ROTEN</div>
        <div style="font-family: Staatliches, sans-serif; font-size: 46px; line-height: 44px; margin-top: 2px;">4</div>
        <div style="font-size: 12px; color: #A89887;">Serie 2</div>
      </div>
      <div style="flex-grow: 1; padding: 13px 15px; border-radius: 3px; background: rgba(240,168,48,0.10); border-left: 3px solid #F0A830;">
        <div style="font-family: Staatliches, sans-serif; font-size: 14px; letter-spacing: 1.6px; color: #F0A830;">DIE GELBEN</div>
        <div style="font-family: Staatliches, sans-serif; font-size: 46px; line-height: 44px; margin-top: 2px;">2</div>
        <div style="font-size: 12px; color: #A89887;">Serie 0</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#6E6155" stroke-width="1.8"/><path d="M12 7.5v5.5M12 16h.01" stroke="#6E6155" stroke-width="2" stroke-linecap="round"/></svg>
      <span style="font-size: 12px; color: #6E6155;">Die Kamera fragt nach &mdash; sie entscheidet nicht.</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
