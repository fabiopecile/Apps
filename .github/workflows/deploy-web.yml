name: Web-App veröffentlichen

# Baut die Web-Version und stellt sie auf Cloudflare Pages. Läuft bei jedem Push
# auf main, der die App verändert — und lässt sich unter "Actions" jederzeit
# von Hand starten.
#
# WARUM CLOUDFLARE UND NICHT MEHR GITHUB PAGES
#
# GitHub Pages stellt eine Seite immer unter <kontoname>.github.io bereit. Der
# Kontoname lässt sich dort nicht weglassen, und er ist hier ein echter Name.
# Cloudflare Pages vergibt stattdessen eine Adresse aus dem Projektnamen,
# <projekt>.pages.dev, in der nichts über den Betreiber steht.
#
# Zwei Dinge sind dadurch anders als vorher:
#
#   1. Die Seite liegt jetzt im Wurzelverzeichnis und nicht mehr unter /Apps/.
#      EXPO_BASE_URL bleibt deshalb leer — siehe app/+html.tsx, das daraus die
#      Pfade für Manifest, Icons und Service Worker baut.
#   2. Das Repository darf privat sein. GitHub Pages veröffentlicht im
#      kostenlosen Tarif nur aus öffentlichen Repositories; hier lädt der
#      Workflow selbst hoch, und der schert sich nicht darum.
#
# EINMALIG EINZURICHTEN
#
# Die Zugangsdaten CLOUDFLARE_API_TOKEN und CLOUDFLARE_ACCOUNT_ID sind schon da,
# sie werden auch vom Online-Server benutzt (siehe deploy-server.yml). ABER: Das
# Token wurde für Workers ausgestellt und braucht zusätzlich das Recht
# "Cloudflare Pages: Edit". Ohne das bricht der letzte Schritt mit einem
# Berechtigungsfehler ab.
#
#   Cloudflare-Dashboard -> Profil -> API Tokens -> das vorhandene Token
#   bearbeiten -> Permissions -> "Account | Cloudflare Pages | Edit" ergänzen.
#
# Der Projektname ist frei wählbar und bestimmt die Adresse. Voreingestellt ist
# "beerpong", was beerpong.pages.dev ergibt. Ist der Name weltweit schon
# vergeben, meldet Cloudflare das — dann unter Settings -> Secrets and variables
# -> Actions -> Variables eine Variable PAGES_PROJECT mit einem anderen Namen
# anlegen.
on:
  push:
    branches: [main]
    paths:
      - 'beerpong/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

# Nie zwei Deploys gleichzeitig; ein neuerer Push löst den älteren ab.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Bauen und veröffentlichen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beerpong
    steps:
      - uses: actions/checkout@v4

      # Wie in deploy-server.yml: das Secrets-Kontext lässt sich in einer
      # job-weiten Bedingung nicht zuverlässig lesen, also einmal nachsehen und
      # den Rest daran hängen. Ohne Zugangsdaten soll der Lauf einen klaren
      # Hinweis geben statt mit einem kryptischen Fehler abzubrechen.
      - name: Zugangsdaten prüfen
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN und/oder CLOUDFLARE_ACCOUNT_ID fehlen — die Web-App wird nicht veröffentlicht. Die Anleitung steht oben in dieser Datei."
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ready == 'yes'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beerpong/package-lock.json

      - name: Pakete installieren
        if: steps.creds.outputs.ready == 'yes'
        run: npm ci

      - name: Web-Version exportieren
        if: steps.creds.outputs.ready == 'yes'
        run: npx expo export --platform web
        env:
          # Leer, weil Cloudflare Pages die Seite im Wurzelverzeichnis
          # ausliefert. Unter GitHub Pages stand hier /Apps, weil ein
          # Repository dort in einem Unterordner landet.
          EXPO_BASE_URL: ''
          # Adresse des Online-Servers. Leer lassen ist in Ordnung: der
          # Online-Bildschirm sagt dann, dass noch keiner eingetragen ist.
          # Eintragen unter Settings -> Secrets and variables -> Actions ->
          # Variables, siehe deploy-server.yml.
          EXPO_PUBLIC_ONLINE_URL: ${{ vars.ONLINE_URL }}
          # Verkauf an/aus. Leer oder nicht gesetzt = aus, und das ist mit
          # Absicht die Voreinstellung: eine App, die Geld nimmt, braucht
          # Impressum, Widerrufsbelehrung und ein angemeldetes Gewerbe, und
          # nichts davon kann Programmcode erledigen. Ohne Verkauf ist die App
          # vollständig spielbar — die Kamera sogar ohne Wochenlimit.
          #
          # Zum Einschalten sind ZWEI Dinge nötig, beide zusammen:
          #   1. In beerpong/lib/legal.ts den Block OPERATOR ausfüllen
          #      (Name, Straße, Ort, E-Mail).
          #   2. Hier unter Settings -> Secrets and variables -> Actions ->
          #      Variables eine Variable SALES mit dem Wert "on" anlegen.
          # Fehlt eins von beidem, bleibt der Shop zu. Die App sagt auf dem
          # Bildschirm "Alles kostenlos", woran es liegt.
          EXPO_PUBLIC_SALES: ${{ vars.SALES }}

      - name: Nach Cloudflare Pages stellen
        if: steps.creds.outputs.ready == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT }}
        run: |
          name="${PROJECT:-beerpong}"
          echo "Projekt: $name  ->  https://$name.pages.dev"
          # Beim ersten Lauf gibt es das Projekt noch nicht. Ein zweiter
          # Anlauf meldet "already exists", und das ist kein Fehler — deshalb
          # wird die Meldung geschluckt statt den Lauf abzubrechen.
          npx wrangler pages project create "$name" --production-branch=main \
            || echo "Projekt besteht bereits — weiter."
          npx wrangler pages deploy dist --project-name="$name" --branch=main
