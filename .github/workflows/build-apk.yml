name: Android-APK bauen

# Baut eine installierbare APK. Start entweder von Hand unter "Actions" oder
# automatisch, wenn ein Versions-Tag gepusht wird (z. B. v1.0.1) — dann landet
# die APK zusätzlich als Download unter "Releases".
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beerpong
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beerpong/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Pakete installieren
        run: npm ci

      - name: Natives Android-Projekt erzeugen
        # Der android/-Ordner liegt nicht im Repo, sondern wird bei jedem Build
        # aus app.json neu generiert.
        run: npx expo prebuild --platform android --no-install

      - name: Gradle mehr Speicher geben
        # React-Native-Builds sprengen sonst gern den Standard-Heap des Runners.
        run: echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties

      - name: APK bauen
        run: ./gradlew assembleRelease --no-daemon
        working-directory: beerpong/android

      - name: Version auslesen
        id: version
        run: echo "value=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: APK ablegen
        run: |
          mkdir -p ../out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "../out/beerpong-${{ steps.version.outputs.value }}.apk"

      - name: Als Download anhängen
        uses: actions/upload-artifact@v4
        with:
          name: beerpong-apk
          path: out/beerpong-*.apk
          if-no-files-found: error

      - name: Release erstellen
        # Nur bei einem Tag — dann bekommt die APK eine feste Download-Adresse,
        # die sich verschicken lässt.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ../out/beerpong-*.apk \
            --title "Beerpong ${{ steps.version.outputs.value }}" \
            --notes "APK herunterladen und öffnen. Android fragt einmalig, ob Installationen aus dieser Quelle erlaubt sind — bestätigen, fertig."
